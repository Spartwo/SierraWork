@PART[NMB117SEgnine]:NEEDS[Waterfall&NMB]:FOR[SierraWaterfallEffects]
{
	!EFFECTS {}

	EFFECTS
	{
		wf-running
		{
			AUDIO
			{
				channel = Ship
				clip = NMB/Parts/Engine/sound/afterburner2
				volume = 0.0 0.0
				volume = 1.0 1.0
				pitch = 0.0 0.5
				pitch = 1.0 1.0
				loop = true
			}

		}

		wf-spool
		{
			AUDIO
			{
				channel = Ship
				clip = NMB/Parts/Engine/sound/jet
				volume = 0.0 0.0
				volume = 1.0 0.8
				pitch = 0.0 0.5
				pitch = 1.0 1.0
				loop = true
			}

		}

		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_medium
				volume = 1
				pitch = 2
				loop = false
			}

		}

		disengage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1
				pitch = 2
				loop = false
			}

		}

		flameout
		{
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1
				pitch = 2
				loop = false
			}

		}

	}

	@MODULE[ModuleEngines*]
	{
		%powerEffectName = wf-running
		%runningEffectName = wf-running
		%spoolEffectName = wf-spool
		%engageEffectName = engage
		%disengageEffectName = disengage
		%flameoutEffectName = flameout
	}

	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = NMB117SEgnine-waterfall
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			responseRateUp = 0.6
			responseRateDown = 0.32
		}
		CONTROLLER
		{
			name = mach
			linkedTo = mach
		}
		TEMPLATE
		{
			templateName = kp-kerozine-afterburner-117
			overrideParentTransform = T
			position = 0,0,1.3
			rotation = 0,0,0
			scale = 1.17,1.17,1
		}

	}

}




