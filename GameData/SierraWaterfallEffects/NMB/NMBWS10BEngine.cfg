@PART[NMBWS10BEngine]:NEEDS[Waterfall&NMB]:FOR[SierraWaterfallEffects]
{
	!EFFECTS {}

	EFFECTS
	{
		power
		{
			AUDIO
			{
				channel = Ship
				clip = NMB/Parts/Engine/sound/afterburner2
				volume = 0.0 0.0
				volume = 0.25 0.0
				volume = 0.26 0.5
				volume = 0.93 0.55
				volume = 0.935 1
				volume = 1.0 1
				pitch = 0.0 0.7
				pitch = 0.93 0.8
				pitch = 0.95 1.0
				pitch = 1.0 1.0
				loop = true
			}

		}

		running
		{
			AUDIO
			{
				channel = Ship
				clip = NMB/Parts/Engine/sound/jet
				volume = 0.0 0.0
				volume = 0.05 1.2
				volume = 0.75 2
				volume = 1.0 1.3
				pitch = 0.0 0.0
				pitch = 0.1 0.4
				pitch = 0.93 1.2
				pitch = 0.95 1.5
				pitch = 1.0 1.52
				loop = true
			}

		}

		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_medium
				volume = 1.0
				pitch = 2.0
				loop = false
			}

		}

		disengage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 2.0
				loop = false
			}

		}

		flameout
		{
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 2.0
				loop = false
			}

		}

	}

	@MODULE[ModuleEngines*]
	{
		%flameoutEffectName = flameout
		%spoolEffectName = power
		%powerEffectName = running
		%engageEffectName = engage
		%disengageEffectName = disengage
	}

	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = ws10bFX
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			responseRateUp = 0.95
			responseRateDown = 0.3
		}
		CONTROLLER
		{
			name = mach
			linkedTo = mach
		}
		TEMPLATE
		{
			templateName = kp-kerozine-afterburner-ws10b
			overrideParentTransform = T
			position = 0,0,0
			rotation = 0,0,0
			scale = 0.8,0.8,1
		}

	}

}



