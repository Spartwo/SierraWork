@PART[B9_Engine_Jet_Pod_Medium]:NEEDS[Waterfall&B9_Aerospace]:FOR[SierraWaterfallEffects]
{
	!EFFECTS {}

	EFFECTS
	{
		wf-running
		{
			AUDIO
			{
				channel = Ship
				clip = sound_jet_deep
				volume = 0.0 0.0
				volume = 1.0 1.0
				pitch = 0.0 0.5
				pitch = 1.0 1.0
				loop = true
			}

		}

		wf-spool
		{
			AUDIO
			{
				channel = Ship
				clip = sound_jet_low
				volume = 0.0 0.0
				volume = 1.0 0.8
				pitch = 0.0 0.5
				pitch = 1.0 1.0
				loop = true
			}

		}

		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_medium
				volume = 1
				pitch = 2
				loop = false
			}

		}

		disengage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1
				pitch = 2
				loop = false
			}

		}

		flameout
		{
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1
				pitch = 2
				loop = false
			}

		}

	}

	@MODULE[ModuleEngines*]
	{
		%powerEffectName = wf-running
		%runningEffectName = wf-running
		%spoolEffectName = wf-spool
		%engageEffectName = engage
		%disengageEffectName = disengage
		%flameoutEffectName = flameout
	}

	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = B9_Engine_Jet_Pod_Medium-waterfall
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			engineID = Jet
			responseRateUp = 0.02
			responseRateDown = 0.02
		}
		CONTROLLER
		{
			name = mach
			linkedTo = mach
		}
		TEMPLATE
		{
			templateName = stock-kerozine-turbofan-1
			overrideParentTransform = thrust_transform
			position = 0,0,1
			rotation = 0,0,0
			scale = 0.7,0.7,0.9
		}

	}

}




