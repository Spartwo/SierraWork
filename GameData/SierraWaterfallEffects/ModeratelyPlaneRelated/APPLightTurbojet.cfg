@PART[APPLightTurbojet]:NEEDS[Waterfall&AirplanePlus]:FOR[SierraWaterfallEffects]
{
	!EFFECTS {}

	EFFECTS
	{		

		running_dry
		{
			AUDIO
			{
				channel = Ship
				clip = sound_jet_low
				volume = 0.0 0.0
				volume = 0.05 0.2
				volume = 1.0 0.4
				pitch = 0.0 0.2
				pitch = 0.05 0.4
				pitch = 1.0 0.5
				loop = true
			}
		}

		power_dry
		{
			AUDIO
			{
				channel = Ship
				clip = sound_jet_deep
				volume = 0.0 0.0
				volume = 0.05 0.6
				volume = 1.0 1.3
				pitch = 0.0 0.3
				pitch = 1.0 0.6
				loop = true
			}
		}
		running_wet
		{
			AUDIO
			{
				channel = Ship
				clip = sound_jet_low
				volume = 0.0 0.0
				volume = 0.05 0.2
				volume = 1.0 0.35
				pitch = 0.0 0.2
				pitch = 0.05 0.4
				pitch = 1.0 0.6
				loop = true
			}
		}
		power_wet
		{

			AUDIO
			{
				channel = Ship
				clip = sound_rocket_spurts
				volume = 0.0 0.0
				volume = 0.1 0.4
				volume = 1.0 1.0
				pitch = 0.0 0.5
				pitch = 0.33 0.8
				pitch = 1.0 1.5
				loop = true
			}
		}
		shockDiamond
		{
		}

		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_medium
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		disengage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		flameout
		{
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
	}

	@MODULE[ModuleEngines*],0
	{
		%flameoutEffectName = flameout
		%powerEffectName = power_dry
		%spoolEffectName = running_dry
		%engageEffectName = engage
		%disengageEffectName = disengage
	}
	@MODULE[ModuleEngines*],1
	{
		%flameoutEffectName = flameout
		%powerEffectName = power_wet
		%runningEffectName = shockDiamond
		%spoolEffectName = running_wet
		%engageEffectName = engage
		%disengageEffectName = disengage
	}

	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = APPLightTurbojet-dry
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			engineID = Dry
			responseRateUp = 0.5
			responseRateDown = 0.5
		}
		CONTROLLER
		{
			name = mach
			linkedTo = mach
		}
		TEMPLATE
		{
			templateName = stock-kerozine-turbofan-1
			overrideParentTransform = thrustTransform
			position = 0,0,0
			rotation = 0,0,0
			scale = 0.3,0.3,0.5
		}

	}

	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = APPLightTurbojet-wet
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			engineID = Wet
			responseRateUp = 0.65
			responseRateDown = 0.75
		}
		CONTROLLER
		{
			name = mach
			linkedTo = mach
		}
		TEMPLATE
		{
			templateName = kp-kerozine-afterburner-cougar
			overrideParentTransform = thrustTransform
			position = 0,0,0
			rotation = 0,0,0
			scale = 0.7,0.7,0.5
		}

	}

}




