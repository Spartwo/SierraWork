@PART[M3X_Turbofan]:NEEDS[Waterfall&Mk3Expansion]:FOR[SierraWaterfallEffects]
{
	!EFFECTS {}

	EFFECTS
	{
		wf-running
		{
			AUDIO
			{
				channel = Ship
				clip = Mk3Expansion/Sounds/sound_jet_afterburn_heavy
				volume = 0.0 0.0
				volume = 1.0 1.0
				pitch = 0.0 0.5
				pitch = 1.0 1.0
				loop = true
			}

		}

		wf-spool
		{
			AUDIO
			{
				channel = Ship
				clip = Mk3Expansion/Sounds/sound_jet_low_med
				volume = 0.0 0.0
				volume = 1.0 0.8
				pitch = 0.0 0.5
				pitch = 1.0 1.0
				loop = true
			}

		}

		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_medium
				volume = 1
				pitch = 2
				loop = false
			}

		}

		disengage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1
				pitch = 2
				loop = false
			}

		}

		flameout
		{
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1
				pitch = 2
				loop = false
			}

		}

	}

	@MODULE[ModuleEngines*]
	{
		%powerEffectName = wf-running
		%runningEffectName = wf-running
		%spoolEffectName = wf-spool
		%engageEffectName = engage
		%disengageEffectName = disengage
		%flameoutEffectName = flameout
	}

	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = M3X_Turbofan-waterfall
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			responseRateUp = 0.02
			responseRateDown = 0.02
		}
		CONTROLLER
		{
			name = mach
			linkedTo = mach
		}
		TEMPLATE
		{
			templateName = kp-kerozine-afterburner-buffalo
			overrideParentTransform = BasicJet
			position = 0,-0.7,0
			rotation = 90,0,0
			scale = 1.75,1.75,0.15
		}

	}

}




