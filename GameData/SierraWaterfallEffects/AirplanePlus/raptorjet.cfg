@PART[raptorjet]:NEEDS[Waterfall&AirplanePlus]:FOR[SierraWaterfallEffects]
{
	!EFFECTS {}

	EFFECTS
	{
		wf-running
		{
			AUDIO
			{
				channel = Ship
				clip = AirplanePlus/Sounds/fighter_low
				volume = 0.0 0.0
				volume = 1.0 1.0
				pitch = 0.0 0.5
				pitch = 1.0 1.0
				loop = true
			}

		}

		wf-spool
		{
			AUDIO
			{
				channel = Ship
				clip = AirplanePlus/Sounds/afterburn_big
				volume = 0.0 0.0
				volume = 1.0 0.8
				pitch = 0.0 0.5
				pitch = 1.0 1.0
				loop = true
			}

		}

		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_medium
				volume = 1
				pitch = 2
				loop = false
			}

		}

		disengage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1
				pitch = 2
				loop = false
			}

		}

		flameout
		{
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1
				pitch = 2
				loop = false
			}

		}

	}

	@MODULE[ModuleEngines*]
	{
		%powerEffectName = wf-running
		%runningEffectName = wf-running
		%spoolEffectName = wf-spool
		%engageEffectName = engage
		%disengageEffectName = disengage
		%flameoutEffectName = flameout
	}

	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = raptorjet-dry
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			engineID = Dry
		}
		CONTROLLER
		{
			name = mach
			linkedTo = mach
		}
		TEMPLATE
		{
			templateName = stock-kerozine-turbofan-2
			overrideParentTransform = thrustTransform
			position = 0,0,1.25
			rotation = 0, 0, 0
			scale = 1, 0.9, 0.9
		}

	}

	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = raptorjet-wet
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			engineID = Wet
			responseRateUp = 0.001
			responseRateDown = 0.016
		}
		CONTROLLER
		{
			name = mach
			linkedTo = mach
		}
		TEMPLATE
		{
			templateName = stock-kerozine-afterburner
			overrideParentTransform = thrustTransform
			position = 0,0,0.75
			rotation = 0,0,0
			scale = 1.1, 0.70, 0.9
		}

	}

}




