@PART[B9_Engine_Jet_Turbojet]:FOR[005_TU_B9_Recolour]:NEEDS[TexturesUnlimited&B9_Aerospace]
{
	@MODULE[KSPTextureSwitch],0
	{
		textureSet = B9_Engine_Jet_Turbojet_Paint
	}
	%MODULE[SSTURecolorGUI]
	{
		%name = SSTURecolorGUI
	}
}
+KSP_TEXTURE_SET[MWNN_Stock_Paint]:NEEDS[TexturesUnlimited]
{
	@name = B9_Engine_Jet_Turbojet_Paint
	@MATERIAL
	{
		mesh = model_jet_turbofan_u4
		
		vector = _DiffuseNorm,0.73,0.73,0.73
		vector = _MetalNorm,0.475,0.475,0.475
		vector = _SmoothnessNorm,0.475,0.475,0.475
		
		texture = _MainTex,TURD/TU_B9_Recolour/Engine_Jet_Turbojet/model000_Base
		texture = _BumpMap,TURD/TU_Standardised_Switching/000_PlaceholderTextures/Bump
		texture = _Emissive,B9_Aerospace/Parts/Engine_Jet_Turbojet/model001
		texture = _AOMap,TURD/TU_Standardised_Switching/000_PlaceholderTextures/Occ
		texture = _MetallicGlossMap,TURD/TU_B9_Recolour/Engine_Jet_Turbojet/model000_Spec
		texture = _MaskTex,TURD/TU_B9_Recolour/Engine_Jet_Turbojet/model000_Paint
	}
}

@PART[B9_Engine_Jet_Pod_Medium]:FOR[005_TU_B9_Recolour]:NEEDS[TexturesUnlimited&B9_Aerospace]
