@PART[MPR-SaturnAL41]:FOR[004_TU_MPR_Switching]:NEEDS[TexturesUnlimited&ModeratelyPlaneRelated]
{
	MODULE
	{
		name = KSPTextureSwitch
		sectionName = Appearance
		currentTextureSet = MPR_SaturnAL41_Default
		textureSet = MPR_SaturnAL41_Default
	}
}
+KSP_TEXTURE_SET[Stock_Default]:NEEDS[TexturesUnlimited]
{
	@name = MPR_SaturnAL41_Default
	@MATERIAL
	{
		@shader = KSP/Diffuse
		//mesh = MESH_NAME_HERE
		
		texture = _MainTex,TODO/PATH/TO/DIFFUSE_TEXTURE
		texture = _BumpMap,TURD/TU_Standardised_Switching/000_PlaceholderTextures/Bump
		texture = _Emissive,TURD/TU_Standardised_Switching/000_PlaceholderTextures/Emis
	}
}

