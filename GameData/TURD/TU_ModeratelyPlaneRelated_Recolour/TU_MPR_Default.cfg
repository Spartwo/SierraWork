@PART[MPR-SaturnAL41,MPR-SaturnAL41-938]:FOR[004_TU_MPR_Switching]:NEEDS[TexturesUnlimited&ModeratelyPlaneRelated]
{
	MODULE
	{
		name = KSPTextureSwitch
