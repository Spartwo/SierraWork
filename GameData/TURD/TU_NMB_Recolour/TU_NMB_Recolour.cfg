// Egnines

@PART[NMBF415Egnine]:FOR[005_TU_NMB_Recolour]:NEEDS[TexturesUnlimited&NMB]
{
	@MODULE[KSPTextureSwitch],0
	{
		textureSet = NMB_F415Egnine_Paint
	}
}
+KSP_TEXTURE_SET[MWNN_Stock_Paint]:NEEDS[TexturesUnlimited]
{
	@name = NMB_F415Egnine_Paint
