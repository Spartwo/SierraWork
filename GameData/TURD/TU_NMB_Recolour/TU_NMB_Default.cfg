// Egnines

@PART[NMBProduct30Egnine,NMB117SEgnine]:FOR[004_TU_NMB_Switching]:NEEDS[TexturesUnlimited&NMB]
{
	MODULE
	{
		name = KSPTextureSwitch
		sectionName = Appearance
		currentTextureSet = NMB_11730_Default
		textureSet = NMB_11730_Default
	}
}
+KSP_TEXTURE_SET[Stock_Default]:NEEDS[TexturesUnlimited]
{
	@name = NMB_11730_Default
	@MATERIAL
	{
		//@shader = KSP/Diffuse
		mesh = engine.skin
		mesh = engine
		
		texture = _MainTex,NMB/Parts/Engine/Product30/P30
		texture = _BumpMap,TURD/TU_Standardised_Switching/000_PlaceholderTextures/Bump
		texture = _Emissive,TURD/TU_Standardised_Switching/000_PlaceholderTextures/Emis
	}
}

