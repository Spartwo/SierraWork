@PART[F8f?Bearcat?Cockpit]:FOR[004_TU_AviationCockpits_Switching]:NEEDS[TexturesUnlimited&AviationCockpits]
{
	MODULE
	{
		name = KSPTextureSwitch
		sectionName = Appearance
		currentTextureSet = AviationCockpits_F8f_Default
		textureSet = AviationCockpits_F8f_Default
	}
}
+KSP_TEXTURE_SET[Stock_Default]:NEEDS[TexturesUnlimited]
{
	@name = AviationCockpits_F8f_Default
	@MATERIAL
	{
		//@shader = KSP/Diffuse
		mesh = Hull
		
		texture = _MainTex,AviationCockpits/Command/Glass
		texture = _BumpMap,TURD/TU_Standardised_Switching/000_PlaceholderTextures/Bump
		texture = _Emissive,TURD/TU_Standardised_Switching/000_PlaceholderTextures/Emis
	}
	MATERIAL
	{
		shader = KSP/Diffuse
		mesh = Glass

		texture = _MainTex,AviationCockpits/Command/Glass
		texture = _BumpMap,TURD/TU_Standardised_Switching/000_PlaceholderTextures/Bump
		texture = _Emissive,TURD/TU_Standardised_Switching/000_PlaceholderTextures/Emis
	}
}

